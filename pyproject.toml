# Lint request-path modules; pytest slow replay is an explicit separate selection.
[tool.ruff]
include = ["core/**/*.py", "api/**/*.py"]
line-length = 136

[tool.ruff.lint]
select = ["E", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow and not integration'"
markers = [
    "slow: marks tests as slow (deselect with -m 'not slow')",
    "integration: real installed model or service required; opt in explicitly",
]
