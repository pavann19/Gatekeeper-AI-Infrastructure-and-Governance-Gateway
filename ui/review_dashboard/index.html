<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gatekeeper — Review</title>
<style>
  :root {
    --bg: #f5f5f7;
    --surface: rgba(255, 255, 255, 0.72);
    --surface-solid: #ffffff;
    --border: rgba(0, 0, 0, 0.08);
    --text: #1d1d1f;
    --text-secondary: #6e6e73;
    --text-tertiary: #86868b;
    --accent: #0071e3;
    --accent-hover: #0077ed;
    --danger: #ff3b30;
    --danger-hover: #ff453a;
    --success: #34c759;
    --warn-bg: #fff4e5;
    --warn-text: #9a6700;
    --high-bg: #ffece8;
    --high-text: #c0392b;
    --medium-bg: #fff8e1;
    --medium-text: #9a7d0a;
    --low-bg: #eaf7ec;
    --low-text: #227a3e;
    --shadow: 0 1px 2px rgba(0,0,0,0.04), 0 8px 24px rgba(0,0,0,0.06);
    --shadow-hover: 0 2px 4px rgba(0,0,0,0.06), 0 12px 32px rgba(0,0,0,0.09);
    --radius: 18px;
    --radius-sm: 10px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --surface: rgba(28, 28, 30, 0.72);
      --surface-solid: #1c1c1e;
      --border: rgba(255, 255, 255, 0.08);
      --text: #f5f5f7;
      --text-secondary: #a1a1a6;
      --text-tertiary: #8e8e93;
      --accent: #0a84ff;
      --accent-hover: #3395ff;
      --danger: #ff453a;
      --danger-hover: #ff6961;
      --warn-bg: #3a2f14;
      --warn-text: #f2c675;
      --high-bg: #3a1a17;
      --high-text: #ff8a80;
      --medium-bg: #3a3114;
      --medium-text: #f2d675;
      --low-bg: #14301c;
      --low-text: #7ee0a0;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.35);
      --shadow-hover: 0 2px 4px rgba(0,0,0,0.35), 0 12px 32px rgba(0,0,0,0.45);
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display",
                 "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: 0 0 80px;
  }

  header {
    position: sticky;
    top: 0;
    z-index: 10;
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 20px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }

  .brand {
    display: flex;
    align-items: baseline;
    gap: 10px;
  }

  .brand h1 {
    font-size: 20px;
    font-weight: 600;
    letter-spacing: -0.01em;
    margin: 0;
  }

  .brand .subtitle {
    font-size: 13px;
    color: var(--text-secondary);
  }

  .key-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  input[type="password"], input[type="text"] {
    font-family: inherit;
    font-size: 13px;
    padding: 8px 12px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--surface-solid);
    color: var(--text);
    width: 260px;
    outline: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  input[type="password"]:focus, input[type="text"]:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 4px rgba(10, 132, 255, 0.15);
  }

  button {
    font-family: inherit;
    font-size: 13px;
    font-weight: 500;
    border: none;
    border-radius: var(--radius-sm);
    padding: 8px 16px;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.05s ease, opacity 0.15s ease;
  }

  button:active { transform: scale(0.97); }
  button:disabled { opacity: 0.4; cursor: default; }

  .btn-primary { background: var(--accent); color: white; }
  .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }

  .btn-ghost {
    background: transparent;
    color: var(--text-secondary);
    border: 1px solid var(--border);
  }
  .btn-ghost:hover:not(:disabled) { background: rgba(128,128,128,0.08); }

  .btn-approve { background: var(--success); color: white; }
  .btn-approve:hover:not(:disabled) { filter: brightness(1.08); }

  .btn-reject { background: var(--danger); color: white; }
  .btn-reject:hover:not(:disabled) { background: var(--danger-hover); }

  main {
    max-width: 860px;
    margin: 0 auto;
    padding: 40px 24px 0;
  }

  .status-banner {
    display: none;
    padding: 12px 16px;
    border-radius: var(--radius-sm);
    font-size: 13px;
    margin-bottom: 20px;
    background: var(--warn-bg);
    color: var(--warn-text);
  }
  .status-banner.visible { display: block; }
  .status-banner.error { background: var(--high-bg); color: var(--high-text); }

  .toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }

  .toolbar h2 {
    font-size: 28px;
    font-weight: 650;
    letter-spacing: -0.02em;
    margin: 0;
  }

  .count-pill {
    font-size: 13px;
    color: var(--text-secondary);
    background: var(--surface-solid);
    border: 1px solid var(--border);
    padding: 4px 12px;
    border-radius: 999px;
  }

  .empty-state {
    text-align: center;
    padding: 96px 24px;
    color: var(--text-tertiary);
  }

  .empty-state .glyph {
    font-size: 48px;
    margin-bottom: 16px;
    opacity: 0.5;
  }

  .empty-state h3 {
    font-size: 17px;
    font-weight: 600;
    color: var(--text-secondary);
    margin: 0 0 6px;
  }

  .card-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .card {
    background: var(--surface-solid);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px 22px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.2s ease, transform 0.2s ease, opacity 0.3s ease;
  }

  .card:hover { box-shadow: var(--shadow-hover); }

  .card.resolving { opacity: 0.4; pointer-events: none; transform: scale(0.99); }

  .card-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 10px;
  }

  .card-reason {
    font-size: 15px;
    font-weight: 500;
    line-height: 1.4;
    margin: 0;
    flex: 1;
  }

  .risk-badge {
    flex-shrink: 0;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    padding: 4px 10px;
    border-radius: 999px;
    white-space: nowrap;
  }

  .risk-HIGH { background: var(--high-bg); color: var(--high-text); }
  .risk-MEDIUM { background: var(--medium-bg); color: var(--medium-text); }
  .risk-LOW { background: var(--low-bg); color: var(--low-text); }

  .card-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 18px;
    font-size: 12px;
    color: var(--text-tertiary);
    margin-bottom: 16px;
    font-variant-numeric: tabular-nums;
  }

  .card-meta span b { color: var(--text-secondary); font-weight: 500; }

  .card-actions {
    display: flex;
    gap: 8px;
  }

  .card-actions button { flex: 1; }

  footer {
    text-align: center;
    color: var(--text-tertiary);
    font-size: 12px;
    margin-top: 48px;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .spinner {
    display: inline-block;
    width: 14px;
    height: 14px;
    border: 2px solid rgba(255,255,255,0.4);
    border-top-color: white;
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
    vertical-align: middle;
    margin-right: 6px;
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <h1>Gatekeeper</h1>
    <span class="subtitle">Human Review</span>
  </div>
  <div class="key-row">
    <input type="password" id="apiKey" placeholder="INTERNAL capability API key" autocomplete="off">
    <button class="btn-ghost" id="refreshBtn" title="Refresh (⌘R)">Refresh</button>
  </div>
</header>

<main>
  <div class="status-banner" id="banner"></div>

  <div class="toolbar">
    <h2>Pending</h2>
    <span class="count-pill" id="countPill">—</span>
  </div>

  <div id="emptyState" class="empty-state" style="display:none;">
    <div class="glyph">✓</div>
    <h3>All clear</h3>
    <div>No pending reviews right now.</div>
  </div>

  <div class="card-list" id="cardList"></div>

  <footer>Gatekeeper Review Dashboard · talks to the same API every enforcement decision goes through</footer>
</main>

<script>
const API_BASE = window.location.origin;
const keyInput = document.getElementById('apiKey');
const banner = document.getElementById('banner');
const cardList = document.getElementById('cardList');
const emptyState = document.getElementById('emptyState');
const countPill = document.getElementById('countPill');
const refreshBtn = document.getElementById('refreshBtn');

keyInput.value = sessionStorage.getItem('gatekeeper_api_key') || '';
keyInput.addEventListener('input', () => {
  sessionStorage.setItem('gatekeeper_api_key', keyInput.value);
});

function showBanner(message, isError) {
  banner.textContent = message;
  banner.className = 'status-banner visible' + (isError ? ' error' : '');
}
function hideBanner() {
  banner.className = 'status-banner';
}

function authHeaders() {
  const key = keyInput.value.trim();
  return key ? { 'Authorization': 'Bearer ' + key } : {};
}

function escapeHtml(s) {
  const div = document.createElement('div');
  div.textContent = s == null ? '' : String(s);
  return div.innerHTML;
}

function formatTime(iso) {
  try {
    const d = new Date(iso);
    return d.toLocaleString(undefined, {
      month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
    });
  } catch (e) {
    return iso;
  }
}

function renderReviews(reviews) {
  countPill.textContent = reviews.length + (reviews.length === 1 ? ' review' : ' reviews');

  if (reviews.length === 0) {
    emptyState.style.display = 'block';
    cardList.innerHTML = '';
    return;
  }
  emptyState.style.display = 'none';

  cardList.innerHTML = reviews.map(r => `
    <div class="card" id="card-${r.review_id}">
      <div class="card-top">
        <p class="card-reason">${escapeHtml(r.reason)}</p>
        <span class="risk-badge risk-${escapeHtml(r.risk)}">${escapeHtml(r.risk)}</span>
      </div>
      <div class="card-meta">
        <span><b>tenant</b> ${escapeHtml(r.tenant)}</span>
        <span><b>capability</b> ${escapeHtml(r.capability)}</span>
        <span><b>id</b> ${escapeHtml(r.review_id.slice(0, 12))}…</span>
        <span>${escapeHtml(formatTime(r.created_at))}</span>
      </div>
      <div class="card-actions">
        <button class="btn-approve" onclick="resolve('${r.review_id}', 'APPROVED', this)">Approve</button>
        <button class="btn-reject" onclick="resolve('${r.review_id}', 'REJECTED', this)">Reject</button>
      </div>
    </div>
  `).join('');
}

async function loadReviews() {
  if (!keyInput.value.trim()) {
    showBanner('Enter an INTERNAL capability API key to load the review queue.', false);
    renderReviews([]);
    return;
  }
  refreshBtn.disabled = true;
  refreshBtn.textContent = 'Refreshing…';
  try {
    const res = await fetch(API_BASE + '/api/v1/review', { headers: authHeaders() });
    if (res.status === 401) {
      showBanner('Authentication failed — check the API key.', true);
      renderReviews([]);
      return;
    }
    if (res.status === 403) {
      showBanner('This key does not have INTERNAL capability.', true);
      renderReviews([]);
      return;
    }
    if (!res.ok) {
      showBanner('Request failed: HTTP ' + res.status, true);
      renderReviews([]);
      return;
    }
    const data = await res.json();
    hideBanner();
    renderReviews(data.pending || []);
  } catch (e) {
    showBanner('Could not reach the API at ' + API_BASE + ' — ' + e.message, true);
    renderReviews([]);
  } finally {
    refreshBtn.disabled = false;
    refreshBtn.textContent = 'Refresh';
  }
}

async function resolve(reviewId, outcome, btn) {
  const card = document.getElementById('card-' + reviewId);
  card.classList.add('resolving');
  const originalLabel = btn.innerHTML;
  btn.innerHTML = '<span class="spinner"></span>' + (outcome === 'APPROVED' ? 'Approving' : 'Rejecting');
  card.querySelectorAll('button').forEach(b => b.disabled = true);

  try {
    const res = await fetch(API_BASE + '/api/v1/review/' + reviewId + '/resolve', {
      method: 'POST',
      headers: Object.assign({ 'Content-Type': 'application/json' }, authHeaders()),
      body: JSON.stringify({ outcome }),
    });
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      showBanner('Resolve failed: ' + (body.detail || res.status), true);
      card.classList.remove('resolving');
      btn.innerHTML = originalLabel;
      card.querySelectorAll('button').forEach(b => b.disabled = false);
      return;
    }
    card.style.transition = 'opacity 0.25s ease, transform 0.25s ease';
    card.style.opacity = '0';
    card.style.transform = 'translateX(12px)';
    setTimeout(loadReviews, 260);
  } catch (e) {
    showBanner('Could not reach the API — ' + e.message, true);
    card.classList.remove('resolving');
    btn.innerHTML = originalLabel;
    card.querySelectorAll('button').forEach(b => b.disabled = false);
  }
}

refreshBtn.addEventListener('click', loadReviews);
document.addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'r') {
    e.preventDefault();
    loadReviews();
  }
});

loadReviews();
setInterval(loadReviews, 15000);
</script>

</body>
</html>
