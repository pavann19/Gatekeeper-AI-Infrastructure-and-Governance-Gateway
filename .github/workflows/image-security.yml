# Build the API image, gate fixable high/critical findings and produce an SPDX SBOM.
name: Container Image Security (build, Trivy, SBOM)


on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-scan-sbom:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3

    - name: Build the deployed image
      run: docker build -f Dockerfile.api -t gatekeeper-api:ci .

    - name: Scan the image with Trivy
      uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
      with:
        image-ref: gatekeeper-api:ci
        format: table
        severity: CRITICAL,HIGH
        exit-code: '1'
        ignore-unfixed: true

    - name: Generate SBOM with syft
      uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
      with:
        image: gatekeeper-api:ci
        format: spdx-json
        output-file: gatekeeper-api-sbom.spdx.json

    - name: Upload SBOM artifact
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: gatekeeper-api-sbom
        path: gatekeeper-api-sbom.spdx.json
        retention-days: 90
