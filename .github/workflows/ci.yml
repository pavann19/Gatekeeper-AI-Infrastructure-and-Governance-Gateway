name: Gatekeeper CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        # Use CI-optimised requirements: torch/faiss-cpu ARE included (several
        # tests exercise the real FAISS index and real tensor/label logic
        # against synthetic data — see requirements-ci.txt for why). Only
        # sentence-transformers and real HuggingFace model downloads are
        # excluded/mocked, since those need network access and GB-scale weights.
        pip install -r requirements-ci.txt
        python -m spacy download en_core_web_sm

    - name: Lint (ruff)
      run: |
        # Scoped to core/ and api/ — see pyproject.toml for why. Blocking:
        # the 12 pre-existing issues here were cheap fixes, not a reason to
        # ship this as report-only.
        ruff check core/ api/

    - name: Run Pytest with coverage
      env:
        PYTHONPATH: ${{ github.workspace }}
      run: |
        # Gate set at 65%, a few points BELOW the 69% measured when this was
        # introduced — margin so incidental variance doesn't flake CI, not a
        # ceiling. Ratchet the number up as coverage genuinely improves;
        # lowering it should require the same scrutiny as any other test
        # deletion. core/audit.py and core/intent.py, previously 0% because
        # nothing imported them (docs/ENGINEERING_ASSESSMENT.md §4), were
        # deleted outright once confirmed dead rather than left as an
        # explained coverage gap — the same applies to core/llm.py and
        # core/multimodal.py, whose only caller (scripts/cli_demo.py, also
        # deleted) was itself unreferenced.
        pytest tests/ -v --tb=short --cov=core --cov=api --cov-report=term-missing --cov-fail-under=65
