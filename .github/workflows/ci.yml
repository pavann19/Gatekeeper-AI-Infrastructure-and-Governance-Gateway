name: Gatekeeper CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        # Use CI-optimised requirements: torch/faiss-cpu ARE included (several
        # tests exercise the real FAISS index and real tensor/label logic
        # against synthetic data — see requirements-ci.txt for why). Only
        # sentence-transformers and real HuggingFace model downloads are
        # excluded/mocked, since those need network access and GB-scale weights.
        pip install -r requirements-ci.txt
        python -m spacy download en_core_web_sm

    - name: Run Pytest
      env:
        PYTHONPATH: ${{ github.workspace }}
      run: |
        pytest tests/ -v --tb=short
