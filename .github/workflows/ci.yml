# Source and Redis backend contracts; model assets belong to a separate replay profile.
name: Gatekeeper CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  postgres-contracts:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_USER: gk_test
          POSTGRES_PASSWORD: synthetic-test-only
          POSTGRES_DB: gk_synthetic_ci
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U gk_test -d gk_synthetic_ci" --health-interval 5s --health-timeout 3s --health-retries 5
    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26
      - uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c
        with:
          python-version: '3.10'
      - run: python -m pip install -r requirements-ci.txt
      - name: Transactional PostgreSQL contracts
        env:
          STATE_BACKEND: postgres
          DATABASE_URL: postgresql://gk_test:synthetic-test-only@127.0.0.1:5432/gk_synthetic_ci
          GATEKEEPER_TEST_PG_URL: postgresql://gk_test:synthetic-test-only@127.0.0.1:5432/gk_synthetic_ci
          WARM_MODELS_ON_STARTUP: 'false'
          HF_HUB_OFFLINE: '1'
        run: python -m pytest tests/test_postgres_state_integration.py -m integration --timeout=60 -q

  redis-contracts:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 5
    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26
      - uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c
        with:
          python-version: '3.10'
      - run: python -m pip install -r requirements-ci.txt
      - name: Redis concurrency contracts
        env:
          GATEKEEPER_REDIS_INTEGRATION_URL: redis://localhost:6379/0
        run: python -m pytest tests/test_live_redis_acceptance.py -q

  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3

    - name: Set up Python 3.10
      uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-ci.txt
        python -m spacy download en_core_web_sm

    - name: Lint (ruff)
      run: |
        ruff check core/ api/

    - name: Type check governance boundary
      run: python -m mypy core/ api/ --ignore-missing-imports --explicit-package-bases

    - name: Run Pytest with coverage
      env:
        PYTHONPATH: ${{ github.workspace }}
        HF_HUB_OFFLINE: '1'
        TRANSFORMERS_OFFLINE: '1'
        HF_DATASETS_OFFLINE: '1'
        HF_HOME: ${{ runner.temp }}/gatekeeper-empty-hf-cache
        SENTENCE_TRANSFORMERS_HOME: ${{ runner.temp }}/gatekeeper-empty-st-cache
        WARM_MODELS_ON_STARTUP: 'false'
      run: |
        pytest tests/ -v --tb=short --timeout=60 --cov=core --cov=api --cov-report=term-missing --cov-fail-under=65
