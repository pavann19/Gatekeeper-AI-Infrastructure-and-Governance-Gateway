# Local API, judge, shared state and monitoring stack.
# Provision identity stores before startup; restrict published host ports.
# The active policy is image-managed unless explicitly configured otherwise.
services:
  redis:
    image: redis@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - gatekeeper_net

  ollama:
    image: ollama/ollama@sha256:292ee7945dfc3d5840a181f3ab86fedb1e66703e02c8af98b50f4da56b7e278c
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - gatekeeper_net

  model-pull:
    image: ollama/ollama@sha256:292ee7945dfc3d5840a181f3ab86fedb1e66703e02c8af98b50f4da56b7e278c
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["sh", "-c", "OLLAMA_HOST=http://ollama:11434 ollama pull llama-guard3"]
    networks:
      - gatekeeper_net

  gatekeeper-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_MODEL=llama-guard3
      - OLLAMA_API_URL=http://ollama:11434/api/generate
      - REDIS_URL=redis://redis:6379/0
      - API_KEYS_FILE=/app/config/api_keys.json
      - TENANTS_FILE=/app/config/tenants.json
      - AUDIT_LOG_PATH=/app/audit/audit.jsonl
      - AUDIT_DB_PATH=/app/audit/audit.db
      - REVIEW_QUEUE_FILE=/app/audit/review_queue.json
      - POLICY_VERSIONS_DIR=/app/audit/policy_versions
    env_file:
      - path: .env
        required: false
    volumes:
      - ./config:/app/config:ro
      - audit_data:/app/audit
      - hf_cache:/root/.cache/huggingface
    depends_on:
      redis:
        condition: service_healthy
      model-pull:
        condition: service_completed_successfully
    networks:
      - gatekeeper_net

  prometheus:
    image: prom/prometheus@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - gatekeeper-api
    networks:
      - gatekeeper_net

  grafana:
    image: grafana/grafana@sha256:b28bae15e219c998fb0e0424ed724930cc61b1f61fb404d47c862f9a23f9e572
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-changeme}
      - GF_AUTH_ANONYMOUS_ENABLED=${GRAFANA_ANONYMOUS_ENABLED:-false}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards/files:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - gatekeeper_net

networks:
  gatekeeper_net:
    driver: bridge

volumes:
  ollama_data:
  redis_data:
  audit_data:
  hf_cache:
  prometheus_data:
  grafana_data:
